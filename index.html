<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajay Kesarwani — Full-Stack AI Engineer</title>
<meta name="description" content="Ajay Kesarwani, Full-Stack AI Engineer specializing in RAG, LangChain, and production backend systems.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1420;
    --bg-elevated:#141B2B;
    --bg-card:#161D2E;
    --text:#EDEEF3;
    --text-muted:#8891A3;
    --text-dim:#5D6679;
    --accent:#E8A33D;
    --accent-glow:rgba(232,163,61,0.15);
    --accent-dim:#8A662A;
    --live:#4FD1C5;
    --live-glow:rgba(79,209,197,0.2);
    --border:#232B3D;
    --border-soft:#1B2233;
    --radius:8px;
    --display:'Space Grotesk',sans-serif;
    --body:'IBM Plex Sans',sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--accent);color:#0E1420;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  .wrap{max-width:960px;margin:0 auto;padding:0 28px;}

  /* Subtle background grid texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--border-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:0.35;
    pointer-events:none;
    z-index:0;
  }

  /* Ambient radial gradient light */
  body::after{
    content:"";
    position:fixed; top:-15vw; right:-15vw;
    width:55vw; height:55vw;
    background:radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  /* NAV */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(14,20,32,0.85);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; max-width:960px; margin:0 auto;
  }
  .logo{
    font-family:var(--mono); font-size:14px; font-weight:600;
    display:flex; align-items:center; gap:8px; letter-spacing:0.02em;
  }
  .logo .dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live);flex-shrink:0;}
  .navlinks{display:flex; gap:28px; font-family:var(--mono); font-size:13px; color:var(--text-muted);}
  .navlinks a{transition:color .15s;}
  .navlinks a:hover{color:var(--accent);}
  .navlinks .resume-link{color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:var(--radius);transition:all 0.2s;}
  .navlinks .resume-link:hover{border-color:var(--accent);color:var(--accent);background:rgba(232,163,61,0.05);}
  .navtoggle{display:none;background:none;border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:var(--radius);font-family:var(--mono);cursor:pointer;}

  section{position:relative; z-index:1;}

  /* HERO */
  .hero{padding:96px 0 72px;}
  .status-line{
    font-family:var(--mono); font-size:12px; color:var(--live);
    display:inline-flex; align-items:center; gap:8px;
    border:1px solid rgba(79,209,197,0.3); background:var(--live-glow);
    padding:6px 14px; border-radius:20px; margin-bottom:28px;
    letter-spacing:0.03em;
  }
  .status-line .dot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  h1{
    font-family:var(--display); font-weight:700;
    font-size:clamp(38px,6vw,64px); line-height:1.05; letter-spacing:-0.02em;
    margin-bottom:14px;
  }
  .role{
    font-family:var(--display); font-weight:500; font-size:clamp(18px,2.4vw,24px);
    color:var(--accent); margin-bottom:22px;
  }
  .hero-sub{color:var(--text-muted); font-size:16px; max-width:580px; margin-bottom:32px;}
  .hero-meta{
    font-family:var(--mono); font-size:13px; color:var(--text-dim);
    display:flex; flex-wrap:wrap; gap:6px 0; margin-bottom:36px;
  }
  .hero-meta span:not(:last-child)::after{content:" · "; color:var(--border);}
  .hero-actions{display:flex; gap:14px; flex-wrap:wrap;}
  .btn{
    font-family:var(--mono); font-size:13px; font-weight:500;
    padding:12px 22px; border-radius:var(--radius);
    display:inline-flex; align-items:center; gap:8px;
    transition:all .2s ease; cursor:pointer; border:1px solid transparent;
  }
  .btn-primary{background:var(--accent); color:#0E1420;}
  .btn-primary:hover{background:#f0b559; transform:translateY(-2px); box-shadow:0 6px 20px -4px var(--accent-glow);}
  .btn-ghost{border-color:var(--border); color:var(--text); background:transparent;}
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-2px);}

  /* SECTION HEADERS */
  .section-head{display:flex; align-items:baseline; gap:14px; margin-bottom:32px;}
  .section-num{font-family:var(--mono); font-size:12px; color:var(--text-dim);}
  .section-title{font-family:var(--display); font-weight:600; font-size:26px;}
  .section-rule{flex:1; height:1px; background:var(--border);}
  section.block{padding:64px 0; border-top:1px solid var(--border-soft);}

  /* ABOUT */
  .about-grid{display:grid; grid-template-columns:1fr; gap:20px;}
  .about-text{color:var(--text-muted); font-size:15.5px; max-width:680px;}
  .about-text p{margin-bottom:16px;}
  .about-text strong{color:var(--text); font-weight:600;}
  .looking-for{
    margin-top:24px; padding:18px 20px; border-left:3px solid var(--accent);
    background:var(--bg-elevated); border-radius:0 var(--radius) var(--radius) 0;
  }
  .looking-for .label{font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:6px;}
  .looking-for p{color:var(--text-muted); font-size:14.5px; margin:0;}

  /* EXPERIENCE — deployment log style */
  .log{border-left:1px solid var(--border); margin-left:6px;}
  .log-entry{position:relative; padding:0 0 40px 32px;}
  .log-entry:last-child{padding-bottom:0;}
  .log-entry::before{
    content:""; position:absolute; left:-6px; top:4px;
    width:11px; height:11px; border-radius:50%;
    background:var(--bg); border:2px solid var(--live);
  }
  .log-status{
    font-family:var(--mono); font-size:11px; color:var(--live);
    letter-spacing:0.08em; text-transform:uppercase; margin-bottom:6px;
    display:flex; align-items:center; gap:8px;
  }
  .log-entry:not(:first-child) .log-status{color:var(--text-dim);}
  .log-entry:not(:first-child) .log-status::before{background:var(--text-dim); box-shadow:none;}
  .log-status::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--live);box-shadow:0 0 6px var(--live);}
  .log-role{font-family:var(--display); font-weight:600; font-size:19px; margin-bottom:2px;}
  .log-company{color:var(--accent); font-family:var(--mono); font-size:13px; margin-bottom:14px;}
  .log-list{list-style:none; color:var(--text-muted); font-size:14.5px;}
  .log-list li{position:relative; padding-left:18px; margin-bottom:9px;}
  .log-list li::before{content:"›"; position:absolute; left:0; color:var(--accent);}

  /* EDUCATION */
  .edu-item{padding:22px 0; border-bottom:1px solid var(--border-soft);}
  .edu-item:last-child{border-bottom:none;}
  .edu-top{display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:6px;}
  .edu-school{font-family:var(--display); font-weight:600; font-size:17px;}
  .edu-date{font-family:var(--mono); font-size:12px; color:var(--text-dim);}
  .edu-degree{color:var(--accent); font-size:14px; margin-bottom:8px;}
  .edu-detail{color:var(--text-muted); font-size:14px; margin-bottom:4px;}
  .edu-coursework{font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-top:8px;}

  /* PROJECTS */
  .filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:28px;}
  .filter-btn{
    font-family:var(--mono); font-size:12px; background:var(--bg-elevated);
    color:var(--text-muted); border:1px solid var(--border); padding:6px 14px;
    border-radius:20px; cursor:pointer; transition:all 0.2s ease;
  }
  .filter-btn:hover{color:var(--text); border-color:var(--accent-dim);}
  .filter-btn.active{background:var(--accent); color:#0E1420; border-color:var(--accent); font-weight:600;}

  .proj-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px;}
  .proj-card{
    background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; display:flex; flex-direction:column; gap:12px;
    transition:all .2s ease;
  }
  .proj-card:hover{border-color:var(--accent); transform:translateY(-3px); box-shadow:0 8px 24px -6px var(--accent-glow);}
  .proj-card.featured{border-color:rgba(232,163,61,0.5); grid-column:1 / -1; background:linear-gradient(135deg, var(--bg-card), var(--bg-elevated));}
  .proj-card.hidden{display:none !important;}
  .proj-tag{font-family:var(--mono); font-size:10.5px; color:var(--accent); letter-spacing:0.08em; text-transform:uppercase;}
  .proj-title{font-family:var(--display); font-weight:600; font-size:16.5px;}
  .proj-desc{color:var(--text-muted); font-size:13.5px; flex:1;}
  .proj-stack{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); border:1px solid var(--border); padding:3px 8px; border-radius:10px; background:rgba(255,255,255,0.02);}
  .proj-link{font-family:var(--mono); font-size:12px; color:var(--live); display:inline-flex; align-items:center; gap:6px; margin-top:4px;}
  .proj-link:hover{color:var(--accent);}

  /* SKILLS */
  .skills-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:28px;}
  .skill-group .label{font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:12px;}
  .skill-tags{display:flex; flex-wrap:wrap; gap:8px;}
  .skill-tags .chip{color:var(--text-muted); font-size:12px;}

  /* CONTACT */
  .contact-block{text-align:left;}
  .contact-title{font-family:var(--display); font-weight:700; font-size:clamp(28px,4vw,40px); margin-bottom:14px; max-width:600px;}
  .contact-sub{color:var(--text-muted); font-size:15px; margin-bottom:32px; max-width:520px;}
  .contact-links{display:flex; gap:14px; flex-wrap:wrap;}

  footer{border-top:1px solid var(--border); padding:28px 0; font-family:var(--mono); font-size:12px; color:var(--text-dim); text-align:center;}

  /* Reveal on scroll */
  .reveal{opacity:0; transform:translateY(14px); transition:opacity .5s ease, transform .5s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}

  @media (max-width:720px){
    .navlinks{position:fixed; top:64px; right:0; left:0; background:var(--bg-elevated); flex-direction:column; padding:20px 28px; border-bottom:1px solid var(--border); display:none; gap:16px;}
    .navlinks.open{display:flex;}
    .navtoggle{display:block;}
    .hero{padding:56px 0 48px;}
    .edu-top{flex-direction:column; gap:4px;}
  }
</style>
</head>
<body>

<header>
  <nav>
    <div class="logo"><span class="dot"></span>AJAY.KESARWANI</div>
    <div class="navlinks" id="navlinks">
      <a href="#about">about</a>
      <a href="#experience">experience</a>
      <a href="#projects">projects</a>
      <a href="#skills">skills</a>
      <a href="#contact">contact</a>
      <a href="assets/Ajay_Kesarwani_Resume.pdf" class="resume-link">resume ↓</a>
    </div>
    <button class="navtoggle" id="navtoggle" aria-label="Toggle menu">☰</button>
  </nav>
</header>

<main class="wrap">

  <section class="hero">
    <div class="status-line"><span class="dot"></span>OPEN TO WORK — AI ENGINEER ROLES, EUROPE</div>
    <h1>Ajay Kesarwani</h1>
    <div class="role">Full-Stack AI Engineer · RAG &amp; LangChain</div>
    <p class="hero-sub">Five years shipping high
